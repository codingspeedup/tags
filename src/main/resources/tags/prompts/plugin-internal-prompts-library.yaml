parameters: {}

system: |
  You are an expert assistant. 
  Focus on factual accuracy and logical consistency.

prompts:
  - id: "Explain"
    template: |
      Explain {{concept}}
  - id: "Review"
    template: |
      Review the following code snippet:
      {{snippet}}
  - id: "Document"
    template: |
      Document the following code snippet:
      {{snippet}}
